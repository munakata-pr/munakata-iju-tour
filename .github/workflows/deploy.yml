name: Deploy to GitHub Pages and Notify Slack

on:
  push:
    branches:
      - main

# GitHub Pages のデプロイに必要なパーミッション設定
permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のジョブの重複を防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Translate Shell
        run: |
          sudo apt-get update && sudo apt-get install -y translate-shell

      - name: Translate Commit Message
        id: translate
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          # 英語のコミットメッセージを日本語に自動翻訳（失敗した場合は原文ママ）
          TRANSLATED_MSG=$(trans -brief :ja "$COMMIT_MSG" 2>/dev/null || echo "$COMMIT_MSG")
          
          # 特殊文字のエスケープとトリム
          CLEAN_MSG=$(echo "$TRANSLATED_MSG" | tr -d '"' | tr -d "'" | head -n 3)
          
          echo "TRANSLATED_MSG<<EOF" >> $GITHUB_ENV
          echo "$CLEAN_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Slack Notification Payload
        id: slack-payload
        run: |
          # 1. 変更ファイル一覧を取得
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
          fi
          
          HAS_HTML_CHANGE=false
          while IFS= read -r file; do
            if [ -n "$file" ] && [[ "$file" == *index.html ]]; then
              HAS_HTML_CHANGE=true
            fi
          done <<< "$FILES"
          
          # 2. 変更テキストプレビューの生成
          DIFF_PREVIEW=""
          if [ "$HAS_HTML_CHANGE" = true ]; then
            # index.html のみの差分を取得
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
              HTML_DIFF=$(git diff-tree -p -U0 ${{ github.sha }} -- index.html || true)
            else
              HTML_DIFF=$(git diff -p -U0 ${{ github.event.before }} ${{ github.event.after }} -- index.html || git diff-tree -p -U0 ${{ github.sha }} -- index.html || true)
            fi
            
            # クリーンなテキストのみを抽出
            PREV_TEXT=$(echo "$HTML_DIFF" | grep -E "^-[^-]" | sed 's/^-//' | sed -E 's/<[^>]*>//g' | sed -E 's/^[[:space:]]*//' | grep -E -v '^[[:space:]]*$' || true)
            NEXT_TEXT=$(echo "$HTML_DIFF" | grep -E "^\+[^+]" | sed 's/^+//' | sed -E 's/<[^>]*>//g' | sed -E 's/^[[:space:]]*//' | grep -E -v '^[[:space:]]*$' || true)
            
            if [ -n "$PREV_TEXT" ] || [ -n "$NEXT_TEXT" ]; then
              DIFF_PREVIEW="変更箇所は下記です。"$'\n\n'"【変更前の言葉】"$'\n\n'"${PREV_TEXT}"$'\n\n'"【変更後の言葉】"$'\n\n'"${NEXT_TEXT}"
            fi
          fi
          
          # HTML内の言葉の修正がない場合は、送信不要として出力をセットして終了する
          if [ -z "$DIFF_PREVIEW" ]; then
            echo "HTML内の言葉の修正がないため、Slack通知をスキップします。"
            echo "should_notify=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # メッセージ本文を構築
          MSG_TEXT="【デプロイ完了】移住体験バスツアー特設サイトが更新されました！"$'\n'"公開URL: https://munakata-pr.github.io/munakata-iju-tour"$'\n\n'"${DIFF_PREVIEW}"
          
          # jqを使って安全にJSONを作成
          jq -n --arg msg "$MSG_TEXT" '{"text": $msg}' > /tmp/slack_payload.json
          echo "should_notify=true" >> $GITHUB_OUTPUT

      - name: Slack Notification on Success
        if: success() && steps.slack-payload.outputs.should_notify == 'true'
        run: |
          curl -X POST -H 'Content-type: application/json' -d @/tmp/slack_payload.json ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Notification on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *【デプロイ失敗】移住体験バスツアー特設サイトのデプロイに失敗しました。*\n詳細はGitHub Actionsのログを確認してください。"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
