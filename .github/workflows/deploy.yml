name: Deploy to GitHub Pages and Notify Slack

on:
  push:
    branches:
      - main

# GitHub Pages のデプロイに必要なパーミッション設定
permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のジョブの重複を防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Translate Shell
        run: |
          sudo apt-get update && sudo apt-get install -y translate-shell

      - name: Translate Commit Message
        id: translate
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          # 英語のコミットメッセージを日本語に自動翻訳（失敗した場合は原文ママ）
          TRANSLATED_MSG=$(trans -brief :ja "$COMMIT_MSG" 2>/dev/null || echo "$COMMIT_MSG")
          
          # 特殊文字のエスケープとトリム
          CLEAN_MSG=$(echo "$TRANSLATED_MSG" | tr -d '"' | tr -d "'" | head -n 3)
          
          echo "TRANSLATED_MSG<<EOF" >> $GITHUB_ENV
          echo "$CLEAN_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Slack Notification Payload
        id: slack-payload
        run: |
          # ユーザー指定の通知テキストを一時的にハードコードして送信する
          # 改行や引用符を正確に含めるため、ヒアドキュメントを使用します。
          read -r -d '' MSG_TEXT << 'EOF' || true
【デプロイ完了】移住体験バスツアー特設サイトが更新されました！
公開URL: https://munakata-pr.github.io/munakata-iju-tour

変更箇所は下記です。

【変更前の言葉】

（プレファミリー層、子育て世帯等）
"第1回 プレファミリー・子育て世帯向け体験ツアー"
【第1回】プレファミリー・
将来的な子育てを見据えるプレファミリーや若手ファミリーを対象に、
プレファミリー・子育て世帯向け体感ツアー

【変更後の言葉】

（これから家族が増えるご家庭、子育て世帯等）
"第1回 新婚ご夫婦・子育て世帯向け体験ツアー"
【第1回】新婚ご夫婦・
将来的に子育てを考えている新婚ご夫婦や若いファミリーを対象に、
新婚ご夫婦・子育て世帯向け体感ツアー
EOF

          # jqを使って安全にJSONを作成
          jq -n --arg msg "$MSG_TEXT" '{"text": $msg}' > /tmp/slack_payload.json

      - name: Slack Notification on Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' -d @/tmp/slack_payload.json ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Notification on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *【デプロイ失敗】移住体験バスツアー特設サイトのデプロイに失敗しました。*\n詳細はGitHub Actionsのログを確認してください。"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
