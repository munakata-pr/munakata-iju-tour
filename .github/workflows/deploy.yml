name: Deploy to GitHub Pages and Notify Slack

on:
  push:
    branches:
      - main

# GitHub Pages のデプロイに必要なパーミッション設定
permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のジョブの重複を防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Generate Slack Notification Payload
        id: slack-payload
        run: |
          # 1. 変更ファイル一覧を取得
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
            DIFF_TEXT=$(git diff-tree -p ${{ github.sha }} | head -n 40)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
            DIFF_TEXT=$(git diff -p ${{ github.event.before }} ${{ github.event.after }} | head -n 40 || git diff-tree -p ${{ github.sha }} | head -n 40)
          fi
          
          # 箇条書きフォーマット
          FORMATTED_FILES=""
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              FORMATTED_FILES="${FORMATTED_FILES}\n• ${file}"
            fi
          done <<< "$FILES"
          
          # GitHubコミットURL
          COMMIT_URL="https://github.com/munakata-pr/munakata-iju-tour/commit/${{ github.sha }}"
          
          # メッセージ本文を構築
          MSG_TEXT="🎉 *【デプロイ完了】移住体験バスツアー特設サイトが更新されました！*\n\n*公開URL:* https://munakata-pr.github.io/munakata-iju-tour/\n*更新内容:* ${{ github.event.head_commit.message }}\n*詳細（GitHubで差分を確認）:* <${COMMIT_URL}|こちらをクリック>\n\n*修正されたファイル:*${FORMATTED_FILES}\n\n*具体的な変更内容（抜粋）:*\n\`\`\`diff\n${DIFF_TEXT}\n\`\`\`"
          
          # jqを使って安全にJSONを作成
          jq -n --arg msg "$MSG_TEXT" '{"text": $msg}' > /tmp/slack_payload.json

      - name: Slack Notification on Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' -d @/tmp/slack_payload.json ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Notification on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *【デプロイ失敗】移住体験バスツアー特設サイトのデプロイに失敗しました。*\n詳細はGitHub Actionsのログを確認してください。"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
