name: Deploy to GitHub Pages and Notify Slack

on:
  push:
    branches:
      - main

# GitHub Pages のデプロイに必要なパーミッション設定
permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のジョブの重複を防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Generate Slack Notification Payload
        id: slack-payload
        run: |
          # 1. 変更ファイル一覧を取得
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
            DIFF_TEXT=$(git diff-tree -p -U0 ${{ github.sha }})
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
            DIFF_TEXT=$(git diff -p -U0 ${{ github.event.before }} ${{ github.event.after }} || git diff-tree -p -U0 ${{ github.sha }})
          fi
          
          # 箇条書きフォーマット（日本語の役割説明付き）
          FORMATTED_FILES=""
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              desc=""
              case "$file" in
                *index.html) desc=" 🏠（サイトの全体ページ）" ;;
                *style.css) desc=" 🎨（画面のデザイン・色合い）" ;;
                *app.js) desc=" ⚙️（申し込みボタンなどの動き・機能）" ;;
                *.github/workflows/deploy.yml) desc=" 🤖（自動公開とSlack通知の設定）" ;;
                *README.md) desc=" 📝（開発用の説明書）" ;;
                *assets/*) desc=" 🖼️（画像や写真、イラスト）" ;;
              esac
              FORMATTED_FILES="${FORMATTED_FILES}\n• ${file}${desc}"
            fi
          done <<< "$FILES"
          
          # 変更されたテキストをクリーンに抽出（HTMLタグやコード用記号を排除）
          PREV_TEXT=$(echo "$DIFF_TEXT" | grep -E "^-[^-]" | sed 's/^-//' | sed -E 's/<[^>]*>//g' | sed -E 's/^[[:space:]]*//' | sed -E 's/[{};()=]//g' | grep -E -v '^[[:space:]]*$' | head -n 5)
          NEXT_TEXT=$(echo "$DIFF_TEXT" | grep -E "^\+[^+]" | sed 's/^+//' | sed -E 's/<[^>]*>//g' | sed -E 's/^[[:space:]]*//' | sed -E 's/[{};()=]//g' | grep -E -v '^[[:space:]]*$' | head -n 5)
          
          DIFF_PREVIEW=""
          if [ -n "$PREV_TEXT" ]; then
            DIFF_PREVIEW="${DIFF_PREVIEW}*【変更前】*\n\`\`\`\n${PREV_TEXT}\n\`\`\`\n"
          fi
          if [ -n "$NEXT_TEXT" ]; then
            DIFF_PREVIEW="${DIFF_PREVIEW}*【変更後】*\n\`\`\`\n${NEXT_TEXT}\n\`\`\`\n"
          fi
          
          # GitHubコミットURL
          COMMIT_URL="https://github.com/munakata-pr/munakata-iju-tour/commit/${{ github.sha }}"
          
          # メッセージ本文を構築
          MSG_TEXT="🎉 *【デプロイ完了】移住体験バスツアー特設サイトが更新されました！*\n\n*公開URL:* https://munakata-pr.github.io/munakata-iju-tour/\n*更新内容:* ${{ github.event.head_commit.message }}\n*詳細（GitHubで差分を確認）:* <${COMMIT_URL}|こちらをクリック>\n\n*修正されたファイル:*${FORMATTED_FILES}\n\n*変更されたテキスト・言葉（抜粋）:*\n${DIFF_PREVIEW}"
          
          # jqを使って安全にJSONを作成
          jq -n --arg msg "$MSG_TEXT" '{"text": $msg}' > /tmp/slack_payload.json

      - name: Slack Notification on Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' -d @/tmp/slack_payload.json ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Notification on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *【デプロイ失敗】移住体験バスツアー特設サイトのデプロイに失敗しました。*\n詳細はGitHub Actionsのログを確認してください。"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
